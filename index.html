<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17153d"><title>Jornada 2035 — Destaque-se no Futuro</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#edf0ff;background:#090b1e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 5%,#393175 0,transparent 45%),linear-gradient(145deg,#0a0d25,#121033 75%);line-height:1.5}button,input,textarea{font:inherit}
main{max-width:930px;margin:auto;padding:28px 18px 65px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:28px}.brand{font-size:15px;letter-spacing:.08em;font-weight:850;color:#f9da79}.eyebrow{color:#b3acfa;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
h1{font-size:clamp(34px,7vw,66px);letter-spacing:-.055em;line-height:1.06;margin:12px 0}h2{font-size:clamp(24px,4.5vw,38px);letter-spacing:-.04em;margin:8px 0 13px}h3{margin:8px 0}p{color:#d2d5f2}.lead{font-size:clamp(17px,2.4vw,21px);max-width:700px}.glass{background:rgba(26,29,66,.83);border:1px solid #55517d;border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 18px 45px #06071940}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;background:#ffcf55;color:#211a43;font-weight:850;cursor:pointer;min-height:47px}.btn:hover{filter:brightness(1.08)}.btn.alt{background:#33315b;color:#fff;border:1px solid #706c9a}.btn:disabled{opacity:.48;cursor:not-allowed}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
input,textarea{width:100%;padding:14px 15px;background:#10122e;color:#fff;border:1px solid #7976ad;border-radius:12px;outline:none}input:focus,textarea:focus{border-color:#ffcf55}label{display:block;font-weight:700;margin:16px 0 7px}.meta{color:#aeb2d8;font-size:14px}.pill{display:inline-block;background:#40396b;padding:5px 10px;border:1px solid #7771a4;border-radius:99px;color:#e2e0ff;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.tile{padding:16px;background:#222147;border-radius:16px;border:1px solid #44416d}.tile b{display:block;font-size:27px;color:#ffda79}.tile span{font-size:13px;color:#d0cee9}
.progress{height:9px;background:#3c395f;border-radius:100px;overflow:hidden;margin:18px 0 10px}.bar{height:100%;width:0;background:linear-gradient(90deg,#f7a94a,#e9cf65);transition:width .2s}.options{display:grid;gap:12px;margin-top:22px}.option{width:100%;text-align:left;background:#252449;color:#f7f5ff;border:1px solid #676391;border-radius:14px;padding:16px 17px;cursor:pointer}.option:hover,.option:focus{border-color:#f6d06b;background:#343159}.option.selected{border:2px solid #ffcf55;background:#403657}.option:disabled{cursor:default}.feedback{border-left:4px solid #ffce63;background:#242b4d;padding:16px 18px;border-radius:8px;margin-top:20px}.feedback h3{color:#ffdc86}.feedback p{margin:7px 0}.scores{display:grid;gap:12px}.skill{display:grid;grid-template-columns:minmax(115px,190px) 1fr 38px;align-items:center;gap:12px;font-size:14px}.meter{height:12px;border-radius:50px;background:#353455;overflow:hidden}.meter>div{height:100%;background:linear-gradient(90deg,#7e84ed,#f6c95d);border-radius:50px}.small{font-size:13px;color:#c3c3e4}.footer{margin-top:36px;font-size:12px;color:#a9abce}.hide{display:none}.scenario{font-size:18px;color:#f5f1ff;line-height:1.68}.question{font-weight:800;color:#fff;margin-top:24px}.kicker{color:#ffce62;font-weight:700}.callout{background:#282754;padding:16px;border-radius:12px;border:1px solid #686391}.tag{color:#ffd978;font-weight:800}.summary{white-space:pre-wrap;background:#12142f;color:#ecebff;padding:15px;border:1px solid #59587e;border-radius:14px;overflow-wrap:anywhere}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.grid .tile:last-child{grid-column:span 2}.skill{grid-template-columns:100px 1fr 30px;gap:7px}nav{margin-bottom:20px}main{padding:18px 14px 45px}}
@media print{body{background:white;color:black}main{max-width:none}nav,.btns,.no-print{display:none!important}.glass{border:0;box-shadow:none;background:white;color:black}p,.small,.meta,.skill{color:#111}.summary{color:#111;background:white}.meter{border:1px solid #aaa}}
</style></head>
<body><main><nav><span class="brand">✦ JORNADA 2035</span><span class="pill">LABORATÓRIO DE FUTUROS · MVP</span></nav><div id="app" aria-live="polite"></div><div class="footer">Experiência educativa independente, criada para explorar valores, posturas e atitudes dos profissionais do futuro. Os resultados incentivam reflexão, não medem aptidão profissional.</div></main>
<script>
(function(){
"use strict";
var KEY="jornada2035-v1";
var categories=["Ética e responsabilidade","Pensamento crítico","Colaboração e empatia","Adaptabilidade","Protagonismo"];
var missions=[
{title:"A IA fez quase tudo",area:0,scene:"Você criou uma apresentação com ajuda de uma IA. O resultado impressionou a equipe, mas contém dados que você não conferiu.",question:"Como você se destaca?",choices:[["Apresento assim mesmo, pois ficou convincente.",0,"A aparência profissional não substitui verificação e responsabilidade."],["Confiro fontes, corrijo erros e explico como usei a IA.",3,"Você demonstra transparência, domínio e responsabilidade pelos resultados."],["Descarto qualquer ferramenta de IA.",1,"Evitar tecnologia pode limitar oportunidades; o diferencial é usá-la criticamente."]]},
{title:"A entrevista de 2035",area:4,scene:"Em uma seleção, todos apresentam currículos semelhantes. Você pode mostrar um projeto real que resolveu um problema da sua comunidade.",question:"Qual postura gera mais diferenciação?",choices:[["Mostro o projeto, o impacto e o que aprendi.",3,"Evidências práticas ajudam a demonstrar iniciativa e aprendizado."],["Falo apenas dos certificados.",1,"Formação conta, mas mostrar aplicação e resultados fortalece sua apresentação."],["Digo que consigo fazer qualquer tarefa, mesmo sem experiência.",0,"Promessas sem evidência podem comprometer a confiança."]]},
{title:"O colega está ficando para trás",area:2,scene:"Uma colega experiente tem dificuldade com uma nova ferramenta. A equipe precisa entregar um trabalho coletivo.",question:"Como agir?",choices:[["Ignoro a colega e faço só minha parte.",0,"A equipe perde capacidade e confiança."],["Peço que ela seja afastada do projeto.",0,"Excluir pessoas impede aprendizagem conjunta."],["Proponho uma troca: ensino a ferramenta e aprendo com sua experiência.",3,"A cooperação entre gerações fortalece o time e amplia repertórios."]]},
{title:"Uma resposta convincente, mas falsa",area:1,scene:"A IA fornece uma informação que parece correta, mas você encontra um indício de que a fonte não existe.",question:"O que fazer antes de decidir?",choices:[["Comparo fontes confiáveis e registro a dúvida.",3,"Checar evidências demonstra pensamento crítico."],["Uso a resposta porque a IA costuma acertar.",0,"Confiança sem verificação pode propagar erros."],["Peço à IA para repetir a resposta com mais confiança.",0,"Convicção na linguagem não comprova a veracidade."]]},
{title:"Sua profissão mudou",area:3,scene:"A automação eliminou tarefas repetitivas do seu cargo. Surgiram atividades que exigem novas habilidades.",question:"Qual atitude abre mais caminhos?",choices:[["Espero a empresa decidir por mim.",1,"Esperar pode atrasar sua adaptação."],["Busco aprendizagem, experimento e peço feedback.",3,"Aprender continuamente ajuda a acompanhar mudanças."],["Resisto às mudanças, pois minha formação já basta.",0,"A rigidez pode reduzir sua capacidade de adaptação."]]},
{title:"Uma decisão injusta",area:0,scene:"Um software de recrutamento classifica candidatos sem explicar os critérios. Há indícios de discriminação.",question:"Como responder profissionalmente?",choices:[["Aceito porque a máquina é imparcial.",0,"Algoritmos podem reproduzir vieses de dados e processos."],["Peço revisão humana e avaliação transparente dos critérios.",3,"Responsabilidade e justiça exigem investigar decisões de alto impacto."],["Publico acusações sem verificar fatos.",1,"É importante investigar de forma responsável antes de concluir."]]},
{title:"Uma equipe com opiniões opostas",area:2,scene:"Duas pessoas discordam profundamente sobre o caminho de um projeto. O prazo está próximo.",question:"Que postura favorece resultados?",choices:[["Escuto argumentos, alinho critérios e ajudo a construir uma decisão.",3,"Mediação e escuta fortalecem decisões coletivas."],["Imponho minha ideia porque tenho mais conhecimento técnico.",0,"Conhecimento não justifica silenciar outras perspectivas."],["Evito qualquer conversa e deixo o impasse continuar.",0,"Fugir do conflito pode prejudicar a entrega."]]},
{title:"Tecnologia e meio ambiente",area:1,scene:"Uma solução automatizada aumenta a produtividade, mas também o consumo de água e energia.",question:"Como avaliar essa inovação?",choices:[["Considero somente a economia financeira.",0,"Uma análise restrita pode ignorar impactos importantes."],["Proíbo toda automação sem estudar alternativas.",1,"A avaliação precisa considerar possibilidades e evidências."],["Comparo benefícios, custos e impactos ambientais antes de recomendar.",3,"Pensamento sistêmico favorece escolhas sustentáveis."]]},
{title:"A oportunidade que ninguém viu",area:4,scene:"Uma comunidade tem um problema cotidiano e ninguém ofereceu uma solução adequada, apesar das tecnologias disponíveis.",question:"O que faria um jovem se destacar?",choices:[["Entendo a necessidade, converso com moradores e testo uma solução pequena.",3,"Iniciativa, empatia e experimentação conectam ideias a necessidades reais."],["Crio um aplicativo sem conversar com ninguém.",1,"Uma solução pode falhar se o problema real não foi compreendido."],["Aguardo uma grande empresa resolver.",0,"Esperar elimina a oportunidade de aprender e criar valor."]]},
{title:"Pressão para estar disponível sempre",area:3,scene:"Seu time usa assistentes digitais 24 horas por dia. Alguns colegas sentem que precisam responder a qualquer momento.",question:"Qual atitude combina desempenho e sustentabilidade humana?",choices:[["Defendo metas claras, pausas e acordos de disponibilidade.",3,"Limites saudáveis sustentam colaboração e desempenho a longo prazo."],["Respondo mensagens a qualquer hora para provar dedicação.",1,"Disponibilidade constante pode comprometer bem-estar e qualidade."],["Ignoro todos os contatos, mesmo durante meu horário de trabalho.",0,"Limites precisam ser combinados com responsabilidade."]]}
];
var state;
function initial(){return {phase:"home",name:"",mode:"Equipe",index:0,answers:[],plan:"",action:""}}
function restore(){try{var v=JSON.parse(localStorage.getItem(KEY));if(v&&v.phase&&Array.isArray(v.answers))return v}catch(e){}return initial()}
state=restore();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]})}
function el(){return document.getElementById("app")}
function render(){
if(state.phase==="home")return home();
if(state.phase==="play")return play();
if(state.phase==="plan")return plan();
return results();
}
function home(){
el().innerHTML='<section><div class="eyebrow">Sua carreira começa nas escolhas de hoje</div><h1>O FUTURO PRECISA <span style="color:#ffd56b">DE VOCÊ.</span></h1><p class="lead">Em 2035, as tecnologias mudaram. O que vai diferenciar você no mercado de trabalho? Entre em uma jornada de decisões sobre ética, colaboração, pensamento crítico, adaptação e protagonismo.</p><div class="grid"><div class="tile"><b>10</b><span>Missões interativas</span></div><div class="tile"><b>5</b><span>Competências observadas</span></div><div class="tile"><b>30–45</b><span>Minutos em grupo</span></div></div><section class="glass"><h2>Preparar missão</h2><label for="player">Nome do participante ou da equipe</label><input id="player" maxlength="60" placeholder="Ex.: Equipe Inovadores" value="'+escapeHtml(state.name)+'"><label for="mode">Formato</label><div class="btns"><button class="btn alt" id="ind" type="button">Individual</button><button class="btn alt" id="team" type="button">Em equipe</button></div><p class="small" id="modeLabel">Selecionado: '+escapeHtml(state.mode)+'</p><div class="btns"><button class="btn" id="start" type="button">Iniciar jornada →</button></div></section></section>';
document.getElementById("ind").onclick=function(){state.mode="Individual";document.getElementById("modeLabel").textContent="Selecionado: Individual"};
document.getElementById("team").onclick=function(){state.mode="Equipe";document.getElementById("modeLabel").textContent="Selecionado: Em equipe"};
document.getElementById("start").onclick=function(){state.name=document.getElementById("player").value.trim()||"Participante";state.phase="play";state.index=state.answers.length<missions.length?state.answers.length:0;save();render();};
}
function play(){
var i=state.index,m=missions[i],selected=state.answers[i],done=selected!==undefined;
var options=m.choices.map(function(c,j){return '<button class="option '+(selected===j?'selected':'')+'" data-choice="'+j+'" '+(done?'disabled':'')+'><strong>'+(j+1)+'.</strong> '+escapeHtml(c[0])+'</button>'}).join("");
el().innerHTML='<section class="glass"><div class="eyebrow">Missão '+(i+1)+' de '+missions.length+' · '+escapeHtml(categories[m.area])+'</div><div class="progress"><div class="bar" style="width:'+Math.round((i+1)/missions.length*100)+'%"></div></div><h2>'+escapeHtml(m.title)+'</h2><p class="scenario">'+escapeHtml(m.scene)+'</p><p class="question">'+escapeHtml(m.question)+'</p><div class="options">'+options+'</div>'+(done?'<div class="feedback"><h3>Consequência da escolha</h3><p>'+escapeHtml(m.choices[selected][2])+'</p><div class="kicker">+'+m.choices[selected][1]+' pontos em '+escapeHtml(categories[m.area])+'</div></div>':'<p class="small">Discuta as alternativas antes de decidir. Uma escolha por missão.</p>')+'<div class="btns">'+(done?'<button class="btn" id="next">'+(i===missions.length-1?'Criar meu plano de ação →':'Próxima missão →')+'</button>':'')+'<button class="btn alt" id="back">← '+(i===0?'Início':'Anterior')+'</button></div></section>';
if(!done){document.querySelectorAll("[data-choice]").forEach(function(b){b.onclick=function(){state.answers[i]=Number(b.getAttribute("data-choice"));save();render()}})}
if(done)document.getElementById("next").onclick=function(){if(i===missions.length-1){state.phase="plan"}else state.index++;save();render()};
document.getElementById("back").onclick=function(){if(state.index===0)state.phase="home";else state.index--;save();render()};
}
function plan(){
el().innerHTML='<section class="glass"><div class="eyebrow">Missão final</div><h2>Construa o futuro a partir de hoje</h2><p>Em 2035, não basta dominar ferramentas. Como vamos desenvolver nos jovens os valores, as posturas e as atitudes que os farão se destacar no mercado de trabalho?</p><label for="plan">Que experiência educativa uma escola ou o Senac pode criar hoje?</label><textarea id="plan" rows="5" placeholder="Ex.: simular processos seletivos com IA, debates éticos e desafios em equipes...">'+escapeHtml(state.plan)+'</textarea><label for="action">Qual é o primeiro passo concreto que poderia começar amanhã?</label><textarea id="action" rows="3" placeholder="Ex.: realizar um desafio de 30 minutos com a turma...">'+escapeHtml(state.action)+'</textarea><div class="btns"><button class="btn" id="finish">Ver relatório final →</button><button class="btn alt" id="back">← Voltar às missões</button></div><p class="small">Não existe resposta única nesta missão. Procure uma proposta viável e inclusiva.</p></section>';
document.getElementById("finish").onclick=function(){state.plan=document.getElementById("plan").value.trim();state.action=document.getElementById("action").value.trim();if(!state.plan||!state.action){alert("Preencha a proposta educativa e o primeiro passo.");return}state.phase="results";save();render()};
document.getElementById("back").onclick=function(){state.plan=document.getElementById("plan").value;state.action=document.getElementById("action").value;state.phase="play";state.index=missions.length-1;save();render()};
}
function scores(){var values=[0,0,0,0,0];state.answers.forEach(function(a,i){if(a!==undefined)values[missions[i].area]+=missions[i].choices[a][1]});return values}
function report(){var s=scores(),out="JORNADA 2035 — RELATÓRIO\n\nParticipante/equipe: "+state.name+"\nFormato: "+state.mode+"\n\nCOMPETÊNCIAS (máximo 6 pontos por categoria)\n";categories.forEach(function(c,i){out+=c+": "+s[i]+"/6\n"});out+="\nMISSÕES\n";missions.forEach(function(m,i){var a=state.answers[i];out+=(i+1)+". "+m.title+"\nEscolha: "+(a===undefined?"Não respondida":m.choices[a][0])+"\n"});out+="\nPROPOSTA EDUCATIVA\n"+state.plan+"\n\nPRIMEIRO PASSO\n"+state.action+"\n\nEste instrumento é uma dinâmica educativa, não uma avaliação psicológica ou medida de empregabilidade.";return out}
function results(){var s=scores(),total=s.reduce(function(a,b){return a+b},0),bars=categories.map(function(c,i){return '<div class="skill"><b>'+escapeHtml(c)+'</b><div class="meter"><div style="width:'+(s[i]/6*100)+'%"></div></div><strong>'+s[i]+'/6</strong></div>'}).join("");
el().innerHTML='<section class="glass"><div class="eyebrow">Jornada concluída</div><h1 style="font-size:clamp(32px,6vw,52px)">SEU FUTURO É UMA CONSTRUÇÃO.</h1><p class="lead">Parabéns, '+escapeHtml(state.name)+'! Cada decisão mostrou como valores, posturas e atitudes influenciam a vida profissional.</p><div class="grid"><div class="tile"><b>'+total+'/30</b><span>Pontos de reflexão</span></div><div class="tile"><b>10/10</b><span>Missões vivenciadas</span></div><div class="tile"><b>2035</b><span>Horizonte do futuro</span></div></div><h2>Mapa de competências</h2><div class="scores">'+bars+'</div><p class="small">Pontuações representam alinhamento às escolhas sugeridas pela dinâmica, não uma avaliação individual de competências reais.</p><h2>Do futuro desejado à ação</h2><div class="callout"><b class="tag">Proposta educativa</b><p>'+escapeHtml(state.plan)+'</p><b class="tag">Primeiro passo</b><p>'+escapeHtml(state.action)+'</p></div><div class="btns no-print"><button class="btn" id="print">Imprimir / salvar PDF</button><button class="btn alt" id="download">Baixar relatório .txt</button><button class="btn alt" id="copy">Copiar relatório</button><button class="btn alt" id="reset">Nova jornada</button></div><h3>Reflexão final</h3><p>Qual atitude você começará a praticar hoje para ser um profissional relevante em 2035?</p></section>';
document.getElementById("print").onclick=function(){window.print()};
document.getElementById("download").onclick=function(){var blob=new Blob([report()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jornada-2035-relatorio.txt";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};
document.getElementById("copy").onclick=function(){var txt=report();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){alert("Relatório copiado!")}).catch(function(){fallbackCopy(txt)})}else fallbackCopy(txt)};
document.getElementById("reset").onclick=function(){if(confirm("Iniciar uma nova jornada? O progresso atual será substituído.")){state=initial();save();render()}};
}
function fallbackCopy(text){var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");alert("Relatório copiado!")}catch(e){alert("Não foi possível copiar automaticamente.")}t.remove()}
render();
})();
</script></body></html>
